<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Canceled | Pammy Luxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;600;700&family=Playfair+Display:ital,wght=0,400;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #ebc3db;
            --dark: #0d0d0d;
            --light: #faf8f5;
            --text-main: #1a1a1a;
            --text-dim: #707070;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .cancel-card {
            background-color: var(--white);
            max-width: 500px;
            width: 100%;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .brand-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: var(--dark);
        }

        .brand-logo i {
            font-style: italic;
            font-family: 'Playfair Display', serif;
            color: var(--text-dim);
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background-color: #fff5f5;
            color: #e53e3e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px auto;
            font-size: 2rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 15px;
            color: var(--dark);
        }

        .message {
            font-size: 1rem;
            line-height: 1.6;
            color: var(--text-dim);
            margin-bottom: 35px;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .primary-btn {
            background-color: var(--dark);
            color: var(--white);
            border: none;
            padding: 15px 30px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .primary-btn:hover {
            background-color: #262626;
        }

        .secondary-btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--dark);
            padding: 14px 30px;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .secondary-btn:hover {
            background-color: rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body>

    <div class="cancel-card">
        <div class="brand-logo">Pammy <i>Luxe</i></div>
        
        <div class="icon-wrapper">
            <i class="fa-solid fa-xmark"></i>
        </div>
        
        <h1>Payment Canceled</h1>
        <p class="message">Your transaction was not processed. No funds were subtracted from your account. If you experienced an issue with your bank card verification or 3D Secure checkout, you can re-attempt payment or speak to support.</p>
        
        <div class="btn-group">
            <a href="index.html" class="primary-btn">Return to Cart</a>
            <a href="https://wa.me/27611908644" target="_blank" class="secondary-btn">Contact Store Assistant</a>
        </div>
    </div>

</body>
</html>
